[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cuecheck"
version = "0.1.0"
description = "Finds the subtitle lines that are mistimed or too fast to read, one line at a time"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["subtitles", "accessibility", "captions", "srt", "webvtt", "deaf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Adaptive Technologies",
    "Topic :: Multimedia :: Video",
]
# No runtime dependencies. The parser, the reading-speed limits and the
# report are stdlib; the audio side shells out to ffmpeg, which is a program
# rather than a wheel that can fail to build.
dependencies = []

[project.optional-dependencies]
# Only if ffmpeg is not already installed; this ships a build of it.
ffmpeg = ["imageio-ffmpeg>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
cuecheck = "cuecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
